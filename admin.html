<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NGOCTY NETWORK — Admin</title><style>body{margin:0;background:#0b0e11;color:#f1f3f5;font:14px Arial}.top{height:58px;border-bottom:1px solid #252b33;display:flex;align-items:center;padding:0 18px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#12161b;border:1px solid #252b33;border-radius:10px;padding:16px}.muted{color:#8b949e}.green{color:#0ecb81}.red{color:#f6465d}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:11px;border-bottom:1px solid #252b33;text-align:left}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><header class="top">NGOCTY NETWORK — ADMIN</header><main class="wrap"><div class="grid"><div class="card"><span class="muted">Orders</span><h2 id="orders">0</h2></div><div class="card"><span class="muted">Players</span><h2>300</h2></div><div class="card"><span class="muted">Machines</span><h2 id="machines">1,284</h2></div><div class="card"><span class="muted">System</span><h2 class="green">ONLINE</h2></div></div><h2>Payment Orders</h2><div class="card"><table class="table"><thead><tr><th>Order ID</th><th>Player</th><th>Package</th><th>Amount</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="muted">Chưa có đơn hàng.</td></tr></tbody></table></div><p class="muted">シミュレーションデータ · trang quản trị prototype, không tự xác nhận giao dịch ngân hàng.</p></main><script>let x=JSON.parse(localStorage.getItem('ngocty-v3')||'{}');document.getElementById('orders').textContent=(x.orders||[]).length;document.getElementById('machines').textContent=(x.machines||1284).toLocaleString();document.getElementById('rows').innerHTML=(x.orders||[]).slice().reverse().map((o,i)=>`<tr><td>NGT-${String(i+1).padStart(6,'0')}</td><td>DOAN NGOC TY</td><td>${o.coin} ${o.side}</td><td>${o.qty}</td><td class="green">RECORDED</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Chưa có đơn hàng.</td></tr>';</script></body></html>
